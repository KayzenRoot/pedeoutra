name: Supabase keepalive

# Mitigação para o Supabase Free, que pausa após uma semana sem atividade.
# Não substitui o plano Pro antes de usuários pagantes; se o workflow falhar
# por dois dias seguidos, o staging deve ser verificado manualmente.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase Auth health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 --max-time 20 \
            "$SUPABASE_URL/auth/v1/health" \
            -H "apikey: $SUPABASE_ANON_KEY" >/dev/null
          echo "Supabase Auth health OK"

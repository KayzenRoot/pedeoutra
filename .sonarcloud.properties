# Migrations and tests intentionally repeat historical function bodies and fixtures.
# They are covered by DB/restore tests; CPD noise is excluded from the quality gate.
sonar.cpd.exclusions=supabase/migrations/**,supabase/tests/**,**/*.test.ts,**/*.test.tsx

# SQL migrations are immutable historical contracts validated by the DB/restore
# suites. Sonar's PL/SQL literal/loop rules are not actionable there and would
# drown production-code findings. Application code remains fully analyzed.
sonar.exclusions=supabase/migrations/**,supabase/tests/**
